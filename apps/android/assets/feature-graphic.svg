<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">BluRay Katalog Feature Graphic</title>
  <desc id="desc">Dunkle Feature Graphic mit App Icon, Titel und Claim fuer den Google Play Store.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#17143a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)" />
  <rect x="0" y="0" width="1024" height="500" fill="url(#glow)" />

  <g opacity="0.14">
    <rect x="-40" y="60" width="1120" height="18" rx="9" fill="#cbd5e1" />
    <rect x="-40" y="120" width="1120" height="18" rx="9" fill="#cbd5e1" />
    <rect x="-40" y="380" width="1120" height="18" rx="9" fill="#cbd5e1" />
    <rect x="-40" y="440" width="1120" height="18" rx="9" fill="#cbd5e1" />
  </g>

  <g transform="translate(84 92)" filter="url(#shadow)">
    <rect x="0" y="0" width="316" height="316" rx="56" fill="#0b1020" fill-opacity="0.62" stroke="#334155" stroke-opacity="0.65" />
    <circle cx="158" cy="158" r="122" fill="#1e293b" fill-opacity="0.55" stroke="#38bdf8" stroke-opacity="0.18" />
    <image href="play-store-icon-512.png" x="74" y="74" width="168" height="168" preserveAspectRatio="xMidYMid meet" />
  </g>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#f8fafc">
    <text x="448" y="188" font-size="74" font-weight="800" letter-spacing="0.2">BluRay Katalog</text>
    <text x="448" y="246" font-size="32" font-weight="500" fill="#cbd5e1">Sammlung scannen. Filme verwalten.</text>
    <text x="448" y="292" font-size="24" font-weight="400" fill="#94a3b8">Metadaten finden.</text>
  </g>

  <g opacity="0.65">
    <rect x="448" y="334" width="410" height="2" rx="1" fill="#38bdf8" fill-opacity="0.5" />
    <rect x="448" y="344" width="220" height="2" rx="1" fill="#38bdf8" fill-opacity="0.2" />
  </g>
</svg>
